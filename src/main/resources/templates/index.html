<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">

    <div class="p-4 bg-light rounded-3 mb-4">
        <h1 class="text-primary">Lista de Produtos</h1>
        <p class="text-muted">Painel para controle e gerenciamento de produtos</p>
        <a class="btn btn-primary" href="/products/new">Criar Novo Produto</a>
    </div>

    <div class="alert alert-success" th:if="${success != null}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${fail != null}" th:text="${fail}"></div>

    <table class="table table-hover table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Marca</th>
            <th>País Fabricação</th>
            <th class="text-end">Preço</th>
            <th class="text-center">Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(listProducts)}">
            <td colspan="6" class="text-center text-muted">Nenhum produto cadastrado.</td>
        </tr>
        <tr th:each="product : ${listProducts}">
            <td th:text="${product.id}">1</td>
            <td th:text="${product.nome}">Nome</td>
            <td th:text="${product.marca}">Marca</td>
            <td th:text="${product.paisFabricacao}">País</td>
            <td class="text-end" th:text="${'R$ ' + #numbers.formatDecimal(product.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
            <td class="text-center">
                <a class="btn btn-outline-primary btn-sm" th:href="@{'/products/edit/' + ${product.id}}">Editar</a>
                <a class="btn btn-outline-danger btn-sm" th:href="@{'/products/delete/' + ${product.id}}"
                   onclick="return confirm('Deseja realmente excluir este produto?');">Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
