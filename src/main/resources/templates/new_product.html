<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container col-lg-6 col-md-8 my-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="h4 mb-0">Adicionar Novo Produto</h2>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/products/save}" th:object="${product}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-bold" for="nome">Nome do Produto:</label>
                    <input class="form-control" type="text" id="nome" th:field="*{nome}">
                    <small class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="marca">Marca:</label>
                    <input class="form-control" type="text" id="marca" th:field="*{marca}">
                    <small class="text-danger" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold" for="paisFabricacao">País de Fabricação:</label>
                    <input class="form-control" type="text" id="paisFabricacao" th:field="*{paisFabricacao}">
                    <small class="text-danger" th:if="${#fields.hasErrors('paisFabricacao')}" th:errors="*{paisFabricacao}"></small>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" for="preco">Preço (R$):</label>
                    <input class="form-control" type="number" step="0.01" id="preco" th:field="*{preco}">
                    <small class="text-danger" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></small>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/products" class="btn btn-outline-secondary">Voltar à Lista</a>
                    <button type="submit" class="btn btn-primary">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
